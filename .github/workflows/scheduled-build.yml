name: Website build and deploy

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/scheduled-build.yml"
      - "astro.config.*"
      - "content/chapters/**"
      - "public/**"
      - "src/**"
      - "tests/chapters/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/scheduled-build.yml"
      - "astro.config.*"
      - "content/chapters/**"
      - "public/**"
      - "src/**"
      - "tests/chapters/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
  schedule:
    # Avoid the top-of-hour GitHub Actions scheduling peak.
    - cron: "17 3 * * *"
      timezone: Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Test and build website
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test website content
        run: >-
          node --experimental-strip-types --test
          tests/chapters/compiler.test.ts
          tests/chapters/collection-layout.test.ts

      - name: Build Astro site
        run: npm run build

      - name: Upload static site artifact
        uses: actions/upload-artifact@v7
        with:
          name: astro-dist-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Trigger Cloudflare Pages deployment
        if: ${{ github.event_name != 'pull_request' }}
        env:
          CLOUDFLARE_PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$CLOUDFLARE_PAGES_DEPLOY_HOOK" ]; then
            echo "::error::缺少 GitHub Actions Secret：CLOUDFLARE_PAGES_DEPLOY_HOOK"
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --request POST "$CLOUDFLARE_PAGES_DEPLOY_HOOK"
