<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">A pelican riding a bicycle</title>
  <desc id="desc">A cheerful blue-gray pelican pedals a coral bicycle along a sunny seaside road.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe8f5"/>
      <stop offset="1" stop-color="#f8f2dc"/>
    </linearGradient>
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f95a8"/>
      <stop offset="1" stop-color="#3f647b"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc06f"/>
      <stop offset="1" stop-color="#eb7657"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f57d68"/>
      <stop offset="1" stop-color="#c94f54"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="9"/>
      <feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tinyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope=".2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sunny seaside setting -->
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="947" cy="142" r="72" fill="#ffd77d" opacity=".95"/>
  <g fill="#fff" opacity=".72">
    <path d="M135 180c18-26 58-28 76 0 28-22 78-5 76 30H81c-5-26 23-42 54-30Z"/>
    <path d="M858 250c15-22 49-23 65 0 25-19 68-4 67 26H811c-5-23 19-36 47-26Z"/>
  </g>
  <path d="M0 510c155-34 267-35 407-4 145 33 249 31 391-7 150-40 271-32 402-1v130H0Z" fill="#b6dfcf"/>
  <path d="M0 570c170-35 288-30 438 5 138 32 263 32 390-2 149-40 253-32 372-4v116H0Z" fill="#82c3bc" opacity=".72"/>
  <path d="M0 674h1200v126H0Z" fill="#f4c788"/>
  <path d="M0 692c214-14 355 14 548-1 219-18 389-17 652 3v26H0Z" fill="#e99d6b" opacity=".55"/>
  <ellipse cx="600" cy="704" rx="430" ry="28" fill="#5d6670" opacity=".18"/>

  <!-- Bicycle shadow -->
  <ellipse cx="605" cy="666" rx="286" ry="22" fill="#3b4a55" opacity=".22"/>

  <!-- Bicycle -->
  <g filter="url(#tinyShadow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- wheels -->
    <g fill="#f8f4e8" stroke="#2c4b5c" stroke-width="12">
      <circle cx="360" cy="610" r="104"/>
      <circle cx="865" cy="610" r="104"/>
    </g>
    <g stroke="#6a8996" stroke-width="3" opacity=".9">
      <path d="M360 506v208M256 610h208M286 536l148 148M286 684l148-148"/>
      <path d="M865 506v208M761 610h208M791 536l148 148M791 684l148-148"/>
    </g>
    <!-- frame -->
    <g fill="none" stroke="url(#coral)" stroke-width="14">
      <path d="M360 610 505 430 650 610 360 610Z"/>
      <path d="M505 430h163l-18 180"/>
      <path d="M650 610 865 610"/>
      <path d="M505 430 443 610"/>
    </g>
    <g fill="none" stroke="#2c4b5c" stroke-width="10">
      <path d="M650 610 681 467"/>
      <path d="M681 467c27-17 54-14 72-1"/>
      <path d="M753 466c-7 27-4 50 14 63"/>
      <path d="M493 430h-56"/>
    </g>
    <!-- seat and pedals -->
    <path d="M462 413c20-11 58-11 77 0" fill="none" stroke="#2c4b5c" stroke-width="15"/>
    <circle cx="650" cy="610" r="24" fill="#f5b85f" stroke="#2c4b5c" stroke-width="7"/>
    <path d="M650 610l-43 34M650 610l43-34" stroke="#2c4b5c" stroke-width="7"/>
    <ellipse cx="594" cy="649" rx="24" ry="8" fill="#2c4b5c" transform="rotate(-20 594 649)"/>
    <ellipse cx="706" cy="571" rx="24" ry="8" fill="#2c4b5c" transform="rotate(-20 706 571)"/>
  </g>

  <!-- Pelican body and neck -->
  <g filter="url(#softShadow)" stroke="#2c4b5c" stroke-width="8" stroke-linejoin="round">
    <!-- far wing -->
    <path d="M523 328c-72-48-145-12-137 56 8 63 76 93 144 48l43-43Z" fill="#50798e"/>
    <path d="M429 366c37-14 65-5 98 18" fill="none" stroke="#82a9b7" stroke-width="8" opacity=".8"/>
    <!-- body -->
    <path d="M458 337c55-45 158-37 207 18 33 37 32 106-9 141-46 48-150 35-195-16-39-45-43-107-3-143Z" fill="url(#feather)"/>
    <path d="M476 418c46 30 111 38 165 2" fill="none" stroke="#91b2bf" stroke-width="9" opacity=".75"/>
    <!-- near wing reaching handlebar -->
    <path d="M557 362c49-31 101-5 114 40 7 26-8 56-35 59-30 4-55-27-66-58l-34-25Z" fill="#6f98a9"/>
    <path d="M589 385c24 19 38 36 49 61" fill="none" stroke="#9db8c1" stroke-width="7" opacity=".8"/>
    <!-- long neck -->
    <path d="M504 330c-13-59-16-121 22-153 27-23 73-9 82 21 11 35-14 58-39 78-19 16-18 43-10 70Z" fill="#6f95a8"/>
    <path d="M522 190c20-18 51-10 57 13 7 24-12 41-35 58-16 12-21 29-17 50" fill="none" stroke="#9bb9c3" stroke-width="8" opacity=".8"/>
    <!-- head -->
    <path d="M511 180c-9-43 23-79 69-81 52-3 85 30 76 73-7 34-45 54-86 45Z" fill="#87a9b6"/>
    <path d="M567 108c14-19 42-18 56-4" fill="none" stroke="#b6ced2" stroke-width="8" opacity=".8"/>
    <!-- beak and pouch -->
    <path d="M643 146c86-11 156 11 185 40-35 35-106 49-179 25-30-10-36-57-6-65Z" fill="url(#beak)"/>
    <path d="M651 185c43 7 103-5 148-25-17 33-91 68-146 43-13-6-16-14-2-18Z" fill="#f28a64" stroke="none"/>
    <path d="M691 154c35-3 69 2 101 15" fill="none" stroke="#d75d56" stroke-width="6"/>
    <!-- eye -->
    <circle cx="603" cy="137" r="13" fill="#f9e6b3" stroke="#2c4b5c" stroke-width="5"/>
    <circle cx="606" cy="138" r="6" fill="#243b49" stroke="none"/>
    <circle cx="609" cy="134" r="2.5" fill="#fff" stroke="none"/>
    <!-- legs -->
    <path d="M547 481c18 28 28 68 52 94" fill="none" stroke="#e7a35d" stroke-width="13"/>
    <path d="M628 489c17 31 19 73 22 105" fill="none" stroke="#e7a35d" stroke-width="13"/>
    <path d="M598 575c-16 12-22 25-31 35M598 575c19 10 31 21 41 34" fill="none" stroke="#e7a35d" stroke-width="9"/>
    <path d="M650 594c-12 15-15 28-13 42M650 594c17 9 27 18 36 31" fill="none" stroke="#e7a35d" stroke-width="9"/>
  </g>

  <!-- Small motion marks -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="9" opacity=".8">
    <path d="M155 585h54"/>
    <path d="M102 625h76"/>
    <path d="M985 555h54"/>
  </g>
  <g fill="#fff" opacity=".55">
    <circle cx="190" cy="545" r="7"/><circle cx="1040" cy="515" r="6"/><circle cx="1080" cy="540" r="4"/>
  </g>
</svg>
